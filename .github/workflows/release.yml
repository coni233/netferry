name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false
      - name: Verify
        run: |
          go vet ./...
          go test ./...
          sh -n packaging/unix/install.sh packaging/unix/uninstall.sh
          test -f packaging/windows/install.bat
          test -f packaging/windows/uninstall.bat
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist .build

          build_target() {
            goos="$1"
            goarch="$2"
            suffix="$3"
            archive="$4"
            name="netferry-${goos}-${goarch}"
            staging=".build/${name}"

            mkdir -p "$staging"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -buildvcs=false \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "${staging}/netferry${suffix}" \
              ./cmd/netferry
            cp README.md LICENSE "$staging/"

            if [ "$archive" = "zip" ]; then
              cp packaging/windows/install.bat packaging/windows/uninstall.bat "$staging/"
              (cd .build && zip -qr "../dist/${name}.zip" "$name")
            else
              cp packaging/unix/install.sh packaging/unix/uninstall.sh "$staging/"
              chmod +x "${staging}/install.sh" "${staging}/uninstall.sh"
              tar -C .build -czf "dist/${name}.tar.gz" "$name"
            fi
          }

          build_target windows amd64 .exe zip
          build_target windows arm64 .exe zip
          build_target linux amd64 "" tar
          build_target linux arm64 "" tar
          build_target darwin amd64 "" tar
          build_target darwin arm64 "" tar

          unzip -l dist/netferry-windows-amd64.zip | grep -q "install.bat"
          unzip -l dist/netferry-windows-amd64.zip | grep -q "uninstall.bat"
          tar -tzf dist/netferry-linux-amd64.tar.gz | grep -q "install.sh"
          tar -tzf dist/netferry-linux-amd64.tar.gz | grep -q "uninstall.sh"

          (
            cd dist
            sha256sum netferry-* > checksums.txt
          )

          {
            echo "## NetFerry ${GITHUB_REF_NAME}"
            echo
            echo '```text'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "NetFerry ${tag}" \
              --generate-notes
          fi
